name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      - uses: actions/setup-python@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[plot,test,tweedie]"
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --python-version "${{ matrix.python-version }}" src/acteval
      - run: pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: >-
          python -c "import acteval as ae;
          assert ae.rmse([1, 2], [1, 2]) == 0;
          assert ae.__version__ == '1.0.0'"
