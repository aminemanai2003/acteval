name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[plot,test]"
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --python-version "${{ matrix.python-version }}" src/acteval
      - run: pytest
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: >-
          python -c "import acteval as ae;
          assert ae.rmse([1, 2], [1, 2]) == 0;
          assert ae.__version__ == '0.3.0'"
