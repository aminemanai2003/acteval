[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "acteval-insurance"
version = "0.1.0"
description = "Model-agnostic evaluation of actuarial predictive models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Amine Manai", email = "amine.manai@esprit.tn" },
]
keywords = ["actuarial", "insurance", "model-evaluation", "calibration"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dataframe = ["pandas>=2.1"]
plot = ["matplotlib>=3.8", "pandas>=2.1"]
test = [
  "build>=1.2",
  "mypy>=1.11",
  "pandas-stubs>=2.1",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]
dev = [
  "acteval-insurance[dataframe,plot,test]",
  "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/aminemanai2003/acteval"
Repository = "https://github.com/aminemanai2003/acteval"
Issues = "https://github.com/aminemanai2003/acteval/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/acteval"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=acteval --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["acteval"]

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true
