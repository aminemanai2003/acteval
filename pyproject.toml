[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "acteval-insurance"
dynamic = ["version"]
description = "Insurance-oriented metrics and reports for prediction arrays"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Amine Manai", email = "amine.manai@esprit.tn" },
]
keywords = ["actuarial", "insurance", "model-evaluation", "calibration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.scripts]
acteval = "acteval.cli:main"

[project.optional-dependencies]
docs = ["mkdocs>=1.6,<2"]
plot = ["matplotlib>=3.8"]
tweedie = ["tweedie>=0.0.9,<0.1"]
test = [
  "build>=1.2",
  "mypy>=1.11",
  "pandas-stubs>=2.1",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "twine>=5.1",
]
dev = [
  "acteval-insurance[docs,plot,test,tweedie]",
  "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/aminemanai2003/acteval"
Repository = "https://github.com/aminemanai2003/acteval"
Issues = "https://github.com/aminemanai2003/acteval/issues"
Documentation = "https://aminemanai2003.github.io/acteval/"
Changelog = "https://github.com/aminemanai2003/acteval/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/acteval"]

[tool.hatch.version]
path = "src/acteval/_version.py"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=acteval --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["acteval"]

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tweedie.*"
ignore_missing_imports = true
